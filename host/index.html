<!DOCTYPE html>
<html>
  <head>
    <title>Host</title>
  </head>
  <body>
    <h2>Host Page</h2>

    <iframe src="http://localhost:8080" width="300" height="150"></iframe>
    <iframe src="http://localhost:8081" width="300" height="150"></iframe>
    <script>
      window.parent.addEventListener("my-event", (e) => {
        const msg = e.detail?.message || "No message";
        console.log("Host Page received event:", msg);
      });
    </script>
  </body>
</html>
