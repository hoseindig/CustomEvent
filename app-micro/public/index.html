<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue Widget</title>
    <script type="text/javascript">
      // Wait for widget to be available
      function widgetLoading() {
        if (window.MyVueWidget) {
          executeInitWidget();
        } else {
          setTimeout(widgetLoading, 100);
        }
      }
      function executeInitWidget() {
        try {
          window.MyVueWidget.mount("my-app");
        } catch (error) {
          var pElement = document.createElement("p");
          pElement.innerText =
            "An error occurred while loading the widget. Please retry later.";
          document.body.appendChild(pElement);
        }
      }
      widgetLoading();
    </script>
  </head>
  <body>
    <my-app></my-app>
    <script src="my-widget.js"></script>
  </body>
</html>
